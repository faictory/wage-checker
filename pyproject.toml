[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wage-checker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.15"]

[project.scripts]
wage-checker = "wage_checker.cli:main"

[tool.setuptools]
package-data = { wage_checker = ["data/*.json"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["wage_checker*"]
